<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personagens Traduzidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-4">
        <h1 class="mb-4">Personagens Traduzidos</h1>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle bg-white shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>Foto</th>
                        <th>Nome</th>
                        <th>Afiliação</th>
                        <th>Aliados</th>
                        <th>Inimigos</th>
                    </tr>
                </thead>
                <tbody>
                    {% for personagem in personagens %}
                    <tr>
                        <td>
                            <img src="{{ personagem.foto }}"
                                 alt="{{ personagem.nome }}"
                                 class="rounded-circle"
                                 style="width: 56px; height: 56px; object-fit: cover;">
                        </td>
                        <td class="fw-bold">{{ personagem.nome }}</td>
                        <td>{{ personagem.afiliacao|default:"—" }}</td>
                        <td>{{ personagem.aliados|default:"—" }}</td>
                        <td>{{ personagem.inimigos|default:"—" }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
